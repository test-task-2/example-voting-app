# AWS overlay. Use with the chart defaults (not values.yaml):
#   helm template voting-app charts/voting-app -f values-aws.yaml
#
# This chart does not install AWS Load Balancer Controller or its Gateway.
# Install those on the cluster first, then point parentRefs at that Gateway.
# Result stickiness is TargetGroupConfiguration on the Service (cookie -> pod).
#
# Hosted RDS + ElastiCache. In-cluster db/redis charts stay off.
# Postgres user/password come from Secrets Manager cool/postgres-app.
# POSTGRES_HOST and POSTGRES_PORT come from the Crossplane connection secret
# after RDS is created. REDIS_HOST and REDIS_PORT come from the ElastiCache
# connection secret after Redis is created.

db:
  enabled: false

redis:
  enabled: false

global:
  domains:
    vote: vote.test-task.drunk.guru
    result: result.test-task.drunk.guru
  db:
    enabled: false
    database: app
    connectionSecret: voting-app-postgres-conn
  redis:
    enabled: false
    connectionSecret: voting-app-redis-conn
  gateway:
    provider: aws
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: alb
        namespace: kube-system
        sectionName: https

rds:
  enabled: true

elasticache:
  enabled: true

externalSecret:
  secretStore:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  remoteKey: cool/postgres-app
  redis:
    remoteKey: cool/redis

vote:
  replicaCount: 2
  podAntiAffinity: true
  rollout:
    enabled: true
    revisionHistoryLimit: 2
    progressDeadlineSeconds: 1800
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 75
        - pause:
            duration: 5m
  resources:
    requests:
      cpu: 200m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi
  image:
    repository: 112334179404.dkr.ecr.us-east-1.amazonaws.com/cool/vote
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    nodePort: null
  nodeSelector:
    role: app
  tolerations:
    - key: role
      operator: Equal
      value: app
      effect: NoSchedule

result:
  replicaCount: 2
  podAntiAffinity: true
  rollout:
    enabled: true
    revisionHistoryLimit: 2
    progressDeadlineSeconds: 1800
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 75
        - pause:
            duration: 5m
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi
  image:
    repository: 112334179404.dkr.ecr.us-east-1.amazonaws.com/cool/result
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    nodePort: null
  nodeSelector:
    role: app
  tolerations:
    - key: role
      operator: Equal
      value: app
      effect: NoSchedule

worker:
  replicaCount: 2
  podAntiAffinity: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi
  image:
    repository: 112334179404.dkr.ecr.us-east-1.amazonaws.com/cool/worker
    tag: latest
    pullPolicy: Always
  nodeSelector:
    role: app
  tolerations:
    - key: role
      operator: Equal
      value: app
      effect: NoSchedule
