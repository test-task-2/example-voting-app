{{- if .Values.db.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voting-lib.fullname" . }}-postgres-init
  labels:
    {{- include "voting-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  create-app-user.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    DO \$\$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${POSTGRES_APP_USER}') THEN
        CREATE ROLE ${POSTGRES_APP_USER} LOGIN PASSWORD '${POSTGRES_APP_PASSWORD}';
      END IF;
    END
    \$\$;
    GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_DB} TO ${POSTGRES_APP_USER};
    GRANT ALL ON SCHEMA public TO ${POSTGRES_APP_USER};
    CREATE TABLE IF NOT EXISTS votes (
      id VARCHAR(255) NOT NULL UNIQUE,
      vote VARCHAR(255) NOT NULL
    );
    GRANT ALL ON TABLE votes TO ${POSTGRES_APP_USER};
    EOSQL
{{- end }}
